name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_run:
        description: Optional successful Release run for direct native candidate acceptance
        type: string
        default: ''
      platform:
        description: Platform for direct candidate acceptance
        type: choice
        options: [both, windows, macos]
        default: both

permissions:
  contents: read
  actions: read
  attestations: read

env:
  CARGO_TERM_COLOR: always
  AGENT_COMPANION_RELEASE_BUILD: "1"

jobs:
  native-candidate:
    if: inputs.release_run != ''
    uses: ./.github/workflows/native-tui-acceptance.yml
    with:
      release_run: ${{ inputs.release_run }}
      platform: ${{ inputs.platform }}

  native-menu-bar:
    if: inputs.release_run == ''
    name: Native macOS menu bar
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check native resume contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check menu-bar status and quota behavior
        run: sh scripts/test-macos-ui.sh --menu-bar
      - name: Preserve failed menu-bar renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-menu-bar-diagnostics
          path: target/native-ui-tests/renders/
          if-no-files-found: ignore
          retention-days: 7

  build:
    if: inputs.release_run == ''
    name: Build & test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            packages: --workspace
            console: acomp.exe
          - os: macos-14
            target: aarch64-apple-darwin
            packages: -p agent-companion -p agent-companion-core
            console: acomp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Native Windows acceptance host preflight
        if: runner.os == 'Windows'
        run: ./scripts/test-tui-instances-windows.ps1 -Companion (Get-Command python3).Source -PreflightOnly

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build ${{ matrix.packages }} --target ${{ matrix.target }} --locked
      - name: Resume terminal acceptance
        if: runner.os == 'macOS'
        run: python3 scripts/test-resume-tui.py --binary target/${{ matrix.target }}/debug/acomp

      - name: Clippy
        run: cargo clippy ${{ matrix.packages }} --all-targets --target ${{ matrix.target }} --locked -- -D warnings

      - name: Test
        env:
          AGENT_COMPANION_RENDER_DIR: ${{ github.workspace }}/target/tui-ui-renders
        run: cargo test ${{ matrix.packages }} --target ${{ matrix.target }} --locked

      - name: Preserve native TUI settings and navigation renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-tui-ui-renders
          path: target/tui-ui-renders/
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7

      - name: Common backend and migration tests
        run: cargo test -p agent-companion-core --features server --target ${{ matrix.target }} --locked

      - name: Native TUI installation, update and daemon isolation
        if: runner.os == 'macOS'
        run: python3 scripts/test-tui-instances.py --companion target/${{ matrix.target }}/debug/${{ matrix.console }}

      - name: Native Windows TUI installation, update and daemon isolation
        if: runner.os == 'Windows'
        run: ./scripts/test-tui-instances-windows.ps1 -Companion target/${{ matrix.target }}/debug/${{ matrix.console }}

      - name: Preserve failed macOS UI renders
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-diagnostics
          path: target/native-ui-tests/renders/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package Apple Silicon app
        if: runner.os == 'macOS'
        run: python3 scripts/package-macos.py --binary target/${{ matrix.target }}/debug/agent-companion --output dist

      - name: Privacy scan
        shell: bash
        # The needles live in a repository secret so this public file carries
        # no identifiers of its own. Set PRIVACY_NEEDLES to an extended regex
        # (e.g. "localpart|Users[/\\]+account") under Settings → Secrets and
        # variables → Actions. Forks and secretless checkouts skip the scan.
        env:
          PRIVACY_NEEDLES: ${{ secrets.PRIVACY_NEEDLES }}
        run: |
          if [ -z "$PRIVACY_NEEDLES" ]; then
            echo "PRIVACY_NEEDLES is not set; skipping the privacy scan."
            exit 0
          fi
          privacy_scan_status=0
          # Print filenames only. Invalid regex diagnostics can echo the secret
          # pattern, so suppress stderr and report scanner failures generically.
          git grep -IliE "$PRIVACY_NEEDLES" -- . 2>/dev/null || privacy_scan_status=$?
          case "$privacy_scan_status" in
            0)
              echo "::error::Machine-local identifiers found in tracked files"
              exit 1
              ;;
            1)
              echo "Privacy scan clean."
              ;;
            *)
              echo "::error::Privacy scan could not complete; check the private scan configuration"
              exit 1
              ;;
          esac
