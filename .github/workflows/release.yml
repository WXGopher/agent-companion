name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            packages: --workspace
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            packages: -p agent-companion --bin agent-companion
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Validate release version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == tag ]]; then
            python3 -c 'import os,tomllib; assert os.environ["GITHUB_REF_NAME"] == "v" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]'
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Build test binaries
        run: cargo build ${{ matrix.packages }} --target ${{ matrix.target }} --locked
      - name: Clippy
        run: cargo clippy ${{ matrix.packages }} --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - name: Test
        run: cargo test ${{ matrix.packages }} --target ${{ matrix.target }} --locked -- --test-threads=1
      - name: Common tests
        run: cargo test -p agent-companion-core --features server --target ${{ matrix.target }} --locked
      - name: Build release
        run: cargo build ${{ matrix.packages }} --target ${{ matrix.target }} --release --locked
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          New-Item -ItemType Directory -Force staging, dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/agent-companion.exe, target/${{ matrix.target }}/release/agent-companion-hook.exe, target/${{ matrix.target }}/release/agent-companion-codex.exe, README.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath "dist/agent-companion-v$version-windows-x86_64.zip"
          Get-FileHash "dist/agent-companion-v$version-windows-x86_64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS-windows-x86_64.txt
      - name: Package macOS
        if: runner.os == 'macOS'
        run: python3 scripts/package-macos.py
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/SHA256SUMS-*.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
