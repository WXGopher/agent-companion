[package]
name = "agent-companion-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types and logic for Agent Companion: agent session monitoring, approvals, and usage tracking."

[features]
default = []
# The named-pipe server pulls in tokio. `agent-companion-hook` turns it off so the hook
# binary stays tiny and starts in single-digit milliseconds.
config-edit = ["dep:toml_edit", "dep:tempfile"]
server = ["config-edit", "dep:tokio", "dep:base64", "dep:rusqlite"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
toml_edit = { version = "0.25.13", optional = true }
base64 = { version = "0.22", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
