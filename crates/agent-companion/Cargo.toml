[package]
name = "agent-companion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Codex task and usage companion for macOS and Windows, with a CLI status bar editor."

[[bin]]
name = "agent-companion"
path = "src/main.rs"

[[bin]]
name = "agent-companion-codex"
path = "src/codex_main.rs"

[[bin]]
name = "acomp"
path = "src/acomp_main.rs"

[[test]]
name = "macos_editor"
harness = false

[dependencies]
agent-companion-core = { workspace = true, features = ["config-edit", "resume"] }
clap.workspace = true
crossterm = "0.29"
unicode-width = "0.2"
tempfile.workspace = true
semver = "1"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
sha2 = "0.10"
slint.workspace = true
tokio.workspace = true
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
toml_edit = "0.25.13"
agent-companion-core = { workspace = true, features = ["server"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28"
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9.4"
roxmltree = "0.21"
toml_edit = "0.25.13"
agent-companion-core = { workspace = true, features = ["desktop-history"] }
slint = { workspace = true, features = ["unstable-winit-030"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
serde_json.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSColor", "NSResponder", "NSView", "NSWindow"] }
